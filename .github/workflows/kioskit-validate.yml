name: Kioskit validate (reusable)

# Reusable workflow that validates every device folder in a Kioskit state
# repository on pull requests (kioskit#135, folded into #137). Callers trigger
# it on `pull_request` (never `pull_request_target`) and pass no secrets
# (README.md, "Callers").
#
# It runs the SAME pinned, verified publisher binary as kioskit-publish.yml:
# the pins below are identical to that file's, and test/workflow-contract.test.sh
# fails if they ever differ. `validate` checks every device folder (manifest,
# paths, sizes, a full in-memory bundle build), lists every problem with its
# file, and never contacts the Worker. So this job gets contents:read only: no
# id-token, no secret, nothing a pull request from a fork could misuse.

on:
  workflow_call:

permissions: {}

env:
  PUBLISHER_VERSION: "0.5.1"
  PUBLISHER_SHA256: "8c09efcfa8fcfafb7afd8eae7f9d9a1c4b5a9ecf75a97731ae52059c3c755f14"
  PUBLISHER_KEY_ID: "kioskitd-2026-01"
  PUBLISHER_PUBKEY_B64: "PTd5F+ilIM5ZBp9mDjQ83num4nDnhDwv9G6Vf7kzA/Q="

jobs:
  validate:
    name: kioskit-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Resolve this workflow's pinned commit
        id: self
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::job.workflow_sha is not a full commit SHA"
            exit 1
          fi
          if ! printf '%s' "$WORKFLOW_REPOSITORY" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::job.workflow_repository is not owner/name"
            exit 1
          fi
          {
            echo "repository=$WORKFLOW_REPOSITORY"
            echo "sha=$WORKFLOW_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "validate workflow: $WORKFLOW_REF"
          echo "verifier source:   $WORKFLOW_REPOSITORY@$WORKFLOW_SHA"

      - name: Check out the verifier and trust store at the pinned commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ steps.self.outputs.repository }}
          ref: ${{ steps.self.outputs.sha }}
          path: .kioskit-publish
          persist-credentials: false

      - name: Check out the state repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: state
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Download the pinned publisher (anonymous)
        id: fetch
        run: bash .kioskit-publish/scripts/fetch-publisher.sh --version "$PUBLISHER_VERSION" --out "$RUNNER_TEMP/kioskit-publisher"

      - name: Verify digest, signatures and manifest entry
        id: verify
        run: |
          bash .kioskit-publish/scripts/verify-publisher.sh \
            --dir "$RUNNER_TEMP/kioskit-publisher" \
            --version "$PUBLISHER_VERSION" \
            --sha256 "$PUBLISHER_SHA256" \
            --key-id "$PUBLISHER_KEY_ID" \
            --pubkey-b64 "$PUBLISHER_PUBKEY_B64" \
            --trust-store .kioskit-publish/release-trusted-keys.json \
            --install "$RUNNER_TEMP/kioskit-publisher/bin/kioskit-publish"

      - name: Validate every device folder
        run: '"$RUNNER_TEMP/kioskit-publisher/bin/kioskit-publish" validate --repo-root state'
