name: Mirror a kioskd publisher release

# Surface-pull ingestion (blessed releases.surfaces@1, public-github-mirror;
# kioskit#137 AC-15/16/17). The OWNER dispatches this after each kioskd
# release. kioskd holds no credential for this repository, so there is no
# repository_dispatch, push or schedule trigger; test/workflow-contract.test.sh
# fails if one appears.
#
#   fetch    (Environment `mirror`, required reviewer, contents:read)
#            refuses an existing tag/release, then fetches kioskd's release
#            v<version> with KIOSKD_RELEASE_READ_TOKEN (Contents: read on
#            kioskd; ONLY the fetch step sees it), and verifies the signed
#            manifest, the binary's digest and signature, and SHA256SUMS
#            against the committed release-trusted-keys.json.
#   release  (contents:write, pull-requests:write, no secret; needs fetch)
#            re-verifies the handed-over files, creates the immutable release
#            v<version> (refusing if it exists), then opens the promotion PR
#            that bumps the pins and adds provenance/v<version>.json.
#
# A version without a valid signed candidate fails in `fetch`, so no tag,
# release or PR is created. No major alias (v1) is used: callers pin full
# commit SHAs, so nothing here ever moves a tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: kioskd release version to mirror, X.Y.Z (no leading v)
        required: true
        type: string

permissions: {}

concurrency:
  group: mirror

env:
  PUBLISHER_KEY_ID: "kioskitd-2026-01"
  PUBLISHER_PUBKEY_B64: "PTd5F+ilIM5ZBp9mDjQ83num4nDnhDwv9G6Vf7kzA/Q="

jobs:
  fetch:
    name: Fetch and verify the kioskd candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: mirror
    permissions:
      contents: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/mirror-guard.sh --repo "$REPO" --version "$VERSION"

      - name: Fetch kioskd's release (read-only token)
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.KIOSKD_RELEASE_READ_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bin="kioskit-publish_${VERSION}_linux_amd64"
          gh release download "v$VERSION" --repo JonathanPorta/kioskd --dir "$RUNNER_TEMP/candidate" \
            --pattern "$bin" --pattern "$bin.sig" \
            --pattern release-candidate.json --pattern release-candidate.json.sig \
            --pattern SHA256SUMS
          ls -l "$RUNNER_TEMP/candidate"

      - name: Verify the signed candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash scripts/verify-publisher.sh --dir "$RUNNER_TEMP/candidate" --version "$VERSION" \
            --sha256-from-signed-manifest --require-sha256sums \
            --key-id "$PUBLISHER_KEY_ID" --pubkey-b64 "$PUBLISHER_PUBKEY_B64" \
            --trust-store release-trusted-keys.json

      - name: Hand the verified files to the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create the release and open the promotion PR
    needs: [fetch]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out this repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Receive the verified files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate

      - name: Re-verify before publishing
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash scripts/verify-publisher.sh --dir "$RUNNER_TEMP/candidate" --version "$VERSION" \
            --sha256-from-signed-manifest --require-sha256sums \
            --key-id "$PUBLISHER_KEY_ID" --pubkey-b64 "$PUBLISHER_PUBKEY_B64" \
            --trust-store release-trusted-keys.json

      - name: Create the immutable release (refuses an existing tag)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ github.sha }}
        run: bash scripts/mirror-release.sh --repo "$REPO" --version "$VERSION" --dir "$RUNNER_TEMP/candidate" --target "$TARGET"

      - name: Render the promotion (pins and provenance)
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/render-promotion.sh --root . --dir "$RUNNER_TEMP/candidate" --version "$VERSION"

      - name: Open the promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/open-promotion-pr.sh --repo "$REPO" --version "$VERSION"
