name: CI

# `make check` on every pull request and on main: lint, the workflow contract,
# its mutation proofs, the verify-before-run harness, the mirror tests, the
# surface declaration and the vendored-script manifest. Offline apart from
# installing pinned tools.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install actionlint (pinned by version and sha256)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/al.tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/al.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/al.tgz" -C "$RUNNER_TEMP" actionlint
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint

      - name: Tool versions
        run: |
          yq --version
          jq --version
          openssl version
          shellcheck --version | head -n 2

      - name: make check
        run: make check
